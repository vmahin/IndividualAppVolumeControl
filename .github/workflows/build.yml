name: Build APK + Module
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build modern debug APK
        run: gradle :app:assembleModernDebug --no-daemon
      - name: Package Magisk module
        run: |
          chmod +x module/package.sh
          ./module/package.sh app/build/outputs/apk/modern/debug/app-modern-debug.apk IndividualAppAudioVolumeControl-magisk.zip
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            app/build/outputs/apk/modern/debug/app-modern-debug.apk
            IndividualAppAudioVolumeControl-magisk.zip
