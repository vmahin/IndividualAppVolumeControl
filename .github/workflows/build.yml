name: Build APK + Module
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build modern debug APK
        run: gradle :app:assembleModernDebug --no-daemon
      - name: Package Magisk module
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT2=$(find "$SDK/build-tools" -name aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
            AAPT2=$(find "$SDK/build-tools" -name aapt2 | sort -V | tail -1)
          fi
          echo "Using $AAPT2"
          export PATH="$(dirname "$AAPT2"):$PATH"
          chmod +x module/package.sh
          ./module/package.sh app/build/outputs/apk/modern/debug/app-modern-debug.apk IndividualAppAudioVolumeControl-magisk.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            app/build/outputs/apk/modern/debug/app-modern-debug.apk
            IndividualAppAudioVolumeControl-magisk.zip
